<meta name="theme-color" content="#0e0e10" media="(prefers-color-scheme: dark)">

<style>
@font-face{font-family:Vazirmatn;src:url(vazirmatn.woff2) format("woff2");font-weight:100 900;font-display:swap}
/* Shape rule: containers 18px, controls 12px, chips/FAB/tab pills fully round. Accent: cobalt only. */
:root{
  --bg:#ececef;--card:#f8f8f9;--fg:#18181b;--mut:#5f5f69;--line:#dcdce1;
  --pri:#3454d1;--on-pri:#f8f8f9;--inc:#13795b;--exp:#c2304f;
  --ink:#18181b;--on-ink:#f4f4f5;--ink-mut:#a1a1aa;--inc-ink:#5fd3a1;--exp-ink:#ff93ab;
  --shadow:rgb(52 84 209/.28);
  --r:18px;--rc:12px;color-scheme:light}
@media(prefers-color-scheme:dark){:root{
  --bg:#0e0e10;--card:#18181b;--fg:#ececee;--mut:#9d9da7;--line:#28282d;
  --pri:#8da2ff;--on-pri:#0e0e10;--inc:#4ade9f;--exp:#ff8aa3;
  --ink:#26262c;--shadow:rgb(141 162 255/.22);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.7 Vazirmatn,system-ui,sans-serif;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
main{max-width:620px;margin:auto;padding:10px 16px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;transition:transform .15s,background-color .2s}
button:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.i{width:1.25em;height:1.25em;flex:none;vertical-align:-.25em}
small{font-size:.8em}
/* month nav */
.nav{display:flex;align-items:center;justify-content:space-between;padding:4px 0 12px}
.nav b{font-size:17px;font-weight:700}
.nav button{width:44px;height:44px;border-radius:var(--rc);background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:18px}
/* hero balance */
.hero{background:var(--ink);color:var(--on-ink);border-radius:var(--r);padding:20px 20px 16px}
.hero>small{color:var(--ink-mut);display:block}
.hero .big{display:block;font-size:30px;font-weight:700;line-height:1.4;letter-spacing:-.01em}
.hero .big small{font-size:14px;font-weight:400;color:var(--ink-mut)}
.io{display:grid;grid-template-columns:1fr 1fr;margin-top:14px;padding-top:14px;border-top:1px solid #ffffff1f}
.io>div+div{padding-inline-start:16px;border-inline-start:1px solid #ffffff1f}
.io span{color:var(--ink-mut);font-size:13px;display:flex;align-items:center;gap:4px}
.io b{font-size:17px;font-weight:600}
.io .a-i{color:var(--inc-ink)}.io .a-e{color:var(--exp-ink)}
.inc{color:var(--inc)}.exp{color:var(--exp)}
/* list */
.day{color:var(--mut);font-size:13px;margin:20px 4px 8px;display:flex;justify-content:space-between}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line)}
.group{overflow:hidden}
.tx{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:11px 14px;min-height:60px}
.tx+.tx{border-top:1px solid var(--line)}
.tx:active{transform:none;background:var(--bg)}
.ic{width:40px;height:40px;border-radius:var(--rc);background:var(--bg);display:grid;place-items:center;font-size:20px;flex:none}
.tx .m{flex:1;min-width:0}
.tx .m div:last-child{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-weight:700;white-space:nowrap}
/* empty */
.empty{text-align:center;color:var(--mut);padding:44px 0 8px}
.empty .ic{width:64px;height:64px;font-size:30px;margin:0 auto 12px;border-radius:var(--r);background:var(--card);border:1px solid var(--line)}
.empty p{margin:0 0 16px}
.cta{background:var(--pri);color:var(--on-pri);border-radius:var(--rc);padding:11px 22px;font-weight:700}
/* stats */
.stack{margin-top:12px;display:grid;gap:12px}
.card.p{padding:14px 16px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--mut);font-weight:600}
.ch{height:230px;position:relative}
.lg{display:flex;gap:16px;font-size:13px;color:var(--mut);margin:-2px 0 8px}
.lg i{display:inline-block;width:20px;height:3px;border-radius:2px;vertical-align:middle;margin-inline-end:6px}
.lg i.dash{background:repeating-linear-gradient(90deg,var(--mut) 0 4px,transparent 4px 8px)}
.ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;line-height:1.5}
.ctr small{color:var(--mut)}.ctr b{font-size:16px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi strong{font-size:17px;display:block}.kpi small{color:var(--mut);display:block}
.rank{display:flex;align-items:center;gap:10px;margin:10px 0}
.rank i{width:10px;height:10px;border-radius:50%;flex:none}
.rank>div{flex:1}.rank .t{display:flex;justify-content:space-between;gap:8px}
.rank .bar{height:5px;border-radius:3px;margin-top:4px}
/* tabs */
.tabs{position:fixed;inset:auto 0 0 0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 10px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
.tabs button{flex:1;max-width:160px;padding:6px 4px;border-radius:999px;color:var(--mut);font-size:12px;line-height:1.5}
.tabs button .i{display:block;margin:0 auto 1px;font-size:22px}
.tabs button.on{color:var(--pri);font-weight:700}
.fab{position:fixed;left:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--pri);color:var(--on-pri);font-size:26px;display:grid;place-items:center;box-shadow:0 8px 20px var(--shadow)}
/* sheet */
dialog{border:0;border-radius:24px 24px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));width:100%;max-width:620px;margin:auto auto 0;background:var(--card);color:var(--fg);max-height:94dvh}
dialog[open]{animation:up .32s cubic-bezier(.16,1,.3,1)}
dialog::backdrop{background:rgb(14 14 16/.55)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:var(--rc);padding:4px;margin-bottom:14px}
.seg button{padding:9px;border-radius:9px;color:var(--mut)}
.seg button.on{background:var(--card);font-weight:700;box-shadow:0 1px 3px rgb(24 24 27/.18)}
.seg button.on.ke{color:var(--exp)}.seg button.on.ki{color:var(--inc)}
label{display:block;font-size:13px;color:var(--mut);margin:0 2px 5px}
input{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:var(--rc);padding:11px 12px;margin-bottom:14px}
input::placeholder{color:var(--mut);opacity:.7}
input[aria-invalid=true]{border-color:var(--exp)}
#amt{font-size:26px;font-weight:700;text-align:center;margin-bottom:6px}
.err{color:var(--exp);font-size:13px;min-height:1.7em;margin:0 2px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chips button{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;display:flex;align-items:center;gap:6px}
.chips button.on{border-color:var(--pri);background:var(--pri);color:var(--on-pri)}
.picker{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.picker button{aspect-ratio:1;border-radius:var(--rc);background:var(--bg);border:1px solid var(--line);font-size:24px;display:grid;place-items:center}
.row{display:flex;gap:8px}.row button{flex:1;padding:12px;border-radius:var(--rc);background:var(--bg);display:flex;align-items:center;justify-content:center;gap:6px}
.row .ok{background:var(--pri);color:var(--on-pri);font-weight:700;flex:2}.row .del{color:var(--exp);flex:0 0 52px}
.big-btn{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:var(--rc);background:var(--card);border:1px solid var(--line);margin-bottom:10px;text-align:right}
.muted{color:var(--mut);font-size:13px}
select{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:var(--rc);padding:10px 8px}
.sel{display:grid;grid-template-columns:1fr 1.7fr 1.3fr;gap:8px}
.rs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--bg);border-radius:var(--rc);padding:10px 12px;margin-top:10px}
.rs small{color:var(--mut);display:block}.rs b{font-size:15px}
button:disabled{opacity:.45;pointer-events:none}
#report{display:none}
@media print{body>*:not(#report){display:none!important}body{background:#fff;padding:0}
#report{display:block;color:#000;background:#fff;font-size:12px;line-height:1.6}
#report h1{font-size:20px;margin:0 0 4px}#report h2{font-size:14px;margin:16px 0 6px}
#report table{width:100%;border-collapse:collapse}#report th,#report td{border:1px solid #bbb;padding:3px 8px;text-align:right}#report th{background:#eee}
#report tr{break-inside:avoid}}
.toast{position:fixed;inset:auto 0 calc(150px + env(safe-area-inset-bottom));margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--on-ink);padding:9px 18px;border-radius:999px;font-size:14px;animation:toast 2s both;pointer-events:none}
@keyframes up{from{transform:translateY(32px);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes toast{0%{opacity:0;transform:translateY(8px)}12%,80%{opacity:1;transform:none}100%{opacity:0}}
.rise{animation:rise .55s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--n,0)*45ms)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

  const app=$('#app');
  if(tab==='bak'){
    app.innerHTML=`<div class="stack rise"><h2 style="margin:8px 0 0">خروجی و پشتیبان</h2>
    <div class="card p"><h3>گزارش تراکنش‌ها</h3>
      <div class="chips">${[['all','همه'],['7d','۷ روز اخیر'],['lw','هفتهٔ گذشته'],['tm','این ماه'],['lm','ماه قبل'],['cu','بازهٔ دلخواه']].map(([k,l])=>`<button class="${rng.mode===k?'on':''}" onclick="setR('${k}')">${l}</button>`).join('')}</div>
      ${rng.mode==='cu'?`<label>از</label>${dsel('f')}<label style="margin-top:10px">تا</label>${dsel('t')}`:''}
      <div id="rp"></div>
      <div class="row" style="margin-top:12px"><button class="xp" onclick="exCsv()">${svg('file-csv')} اکسل (CSV)</button><button class="xp" onclick="exPdf()">${svg('printer')} چاپ / PDF</button></div></div>
    <div class="card p"><h3>پشتیبان‌گیری</h3>
    <p class="muted" style="margin:0 0 12px">اطلاعات فقط روی همین گوشی ذخیره می‌شود. با پاک کردن اطلاعات مرورگر یا حذف برنامه از بین می‌رود، پس هر چند وقت یک بار فایل پشتیبان بگیر.</p>
    <button class="big-btn" onclick="exp()">${svg('download-simple')}<span>دانلود فایل پشتیبان<br><small class="muted">${fa(txs.length)} تراکنش</small></span></button>
    <button class="big-btn" style="margin:0" onclick="$('#file').click()">${svg('upload-simple')}<span>بازگردانی از فایل پشتیبان</span></button></div></div>`;
    return prev();
  }
  const cur=unkey(ym), list=inMonth(ym), inc=sum(list.filter(t=>t.type==='i')), ex=sum(list.filter(t=>t.type==='e')), bal=inc-ex;
  let h=`<div class="nav"><button onclick="mv(-1)" aria-label="ماه قبل">${svg('caret-right')}</button><b>${MN[cur.m-1]} ${fa(cur.y,false)}</b><button onclick="mv(1)" aria-label="ماه بعد">${svg('caret-left')}</button></div>
  <section class="hero rise"><small>تراز ماه</small><strong class="big" style="${bal<0?'color:var(--exp-ink)':''}"><span dir="ltr">${bal<0?'−':''}${fa(Math.abs(bal))}</span> <small>تومان</small></strong>
  <div class="io"><div><span class="a-i">${svg('arrow-down-left')} درآمد</span><b>${fa(inc)}</b></div><div><span class="a-e">${svg('arrow-up-right')} خرج</span><b>${fa(ex)}</b></div></div></section>`;
  if(!list.length) h+=`<div class="empty rise" style="--n:2"><div class="ic">${svg('wallet')}</div><p>این ماه تراکنشی ثبت نشده.</p><button class="cta" onclick="openSheet()">ثبت اولین تراکنش</button></div>`;
  else if(tab==='list'){
    const days=[...new Set(list.map(t=>t.date))].sort().reverse();
    days.forEach((d,n)=>{
      const dl=list.filter(t=>t.date===d).sort((a,b)=>b.id-a.id), net=sum(dl.filter(t=>t.type==='i'))-sum(dl.filter(t=>t.type==='e'));
      h+=`<div class="day rise" style="--n:${Math.min(n+1,8)}"><span>${jl(d)}</span><span dir="ltr">${net<0?'−':''}${fa(Math.abs(net))}</span></div><div class="card group rise" style="--n:${Math.min(n+1,8)}">`;
      for(const t of dl) h+=`<button class="tx" onclick="openSheet(${t.id})"><div class="ic">${icon(t.type,t.cat)}</div>
        <div class="m"><div>${esc(t.cat)}</div>${t.note?`<div>${esc(t.note)}</div>`:''}</div>
        <div class="a ${t.type==='i'?'inc':'exp'}" dir="ltr">${t.type==='i'?'+':'−'}${fa(t.amount)}</div></button>`;
      h+='</div>';
    });
  } else h+=statsHtml(list,ex,cur);
  app.innerHTML=h;
  if(tab==='stats'&&list.length)drawCharts(list,cur);
}
function mv(d){ym+=d;render()}

const mlen=(k,l)=>{const m=unkey(k).m;return m<=6?31:m<=11?30:(l.some(t=>jp(t.date).d===30)?30:29)};
function byCat(list){const m={};list.forEach(t=>m[t.cat]=(m[t.cat]||0)+t.amount);return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function statsHtml(list,ex,cur){
  const exl=list.filter(t=>t.type==='e'), rank=byCat(exl);
  const big=[...exl].sort((a,b)=>b.amount-a.amount)[0];
  const isNow=ym===key(jp(today())), nd=isNow?jp(today()).d:(cur.m<=6?31:cur.m<=11?30:29);
  let h=`<div class="stack"><div class="kpi rise">
    <div class="card p"><small>میانگین خرج روزانه</small><strong>${money(ex/nd)}</strong></div>
    <div class="card p"><small>بیشترین خرج</small><strong>${big?money(big.amount):'-'}</strong>${big?`<small>${esc(big.cat)}${big.note?' · '+esc(big.note):''}</small>`:''}</div></div>`;
  if(rank.length) h+=`<div class="card p rise" style="--n:1"><h3>خرج به تفکیک دسته</h3><div class="ch"><canvas id="c1" aria-label="نمودار دونات خرج به تفکیک دسته"></canvas><div class="ctr"><small>جمع خرج</small><b>${fa(ex)}</b></div></div>
    ${rank.map(([c,v],i)=>`<div class="rank"><i style="background:${PAL[i%PAL.length]}"></i><div><div class="t"><span>${esc(c)}</span><span>${fa(v)} · ${fa(v/ex*100)}٪</span></div><div class="bar" style="width:${v/rank[0][1]*100}%;background:${PAL[i%PAL.length]}"></div></div></div>`).join('')}</div>`;
  return h+`<div class="card p rise" style="--n:2"><h3>روند خرج تجمعی، در برابر ماه قبل</h3><div class="lg"><span><i style="background:var(--pri)"></i>این ماه</span><span><i class="dash"></i>ماه قبل</span></div><div class="ch"><canvas id="c4" aria-label="نمودار خطی خرج تجمعی"></canvas></div></div>
    <div class="card p rise" style="--n:2"><h3>درآمد و خرج ۶ ماه اخیر</h3><div class="ch"><canvas id="c2" aria-label="نمودار درآمد و خرج ۶ ماه اخیر"></canvas></div></div>
    <div class="card p rise" style="--n:3"><h3>خرج روزانهٔ این ماه</h3><div class="ch"><canvas id="c3" aria-label="نمودار خرج روزانه"></canvas></div></div></div>`;
}
function drawCharts(list,cur){
  const fg=css('--mut'), grid=css('--line'), compact=new Intl.NumberFormat('fa-IR',{notation:'compact'});
  Chart.defaults.font.family='Vazirmatn,system-ui,sans-serif';Chart.defaults.color=fg;
  Chart.defaults.animation=matchMedia('(prefers-reduced-motion:reduce)').matches?false:{duration:700,easing:'easeOutQuart'};
  const tip={rtl:true,callbacks:{label:c=>` ${c.dataset.label?c.dataset.label+': ':''}${fa(c.parsed.y??c.parsed)} تومان`}};
  const axes={x:{grid:{display:false},border:{display:false}},y:{position:'left',beginAtZero:true,border:{display:false},grid:{color:grid},ticks:{callback:v=>compact.format(v)}}};
  const mk=(id,cfg)=>{const el=$(id);if(el)charts.push(new Chart(el,{...cfg,options:{maintainAspectRatio:false,...cfg.options}}))};
  const rank=byCat(list.filter(t=>t.type==='e'));
  mk('#c1',{type:'doughnut',data:{labels:rank.map(r=>r[0]),datasets:[{data:rank.map(r=>r[1]),backgroundColor:rank.map((_,i)=>PAL[i%PAL.length]),borderColor:css('--card'),borderWidth:3}]},
    options:{cutout:'68%',plugins:{legend:{display:false},tooltip:{rtl:true,callbacks:{label:c=>` ${c.label}: ${fa(c.parsed)} تومان`}}}}});
  const ms=[...Array(6)].map((_,i)=>ym-5+i).map(k=>{const l=inMonth(k);return{k,i:sum(l.filter(t=>t.type==='i')),e:sum(l.filter(t=>t.type==='e'))}});
  mk('#c2',{type:'bar',data:{labels:ms.map(m=>MN[unkey(m.k).m-1]),datasets:[{label:'درآمد',data:ms.map(m=>m.i),backgroundColor:css('--inc'),borderRadius:6,borderSkipped:false},{label:'خرج',data:ms.map(m=>m.e),backgroundColor:css('--exp'),borderRadius:6,borderSkipped:false}]},
    options:{scales:axes,plugins:{legend:{rtl:true,labels:{boxWidth:10,boxHeight:10,useBorderRadius:true,borderRadius:3}},tooltip:tip}}});
  const prevL=inMonth(ym-1), n=Math.max(mlen(ym,list),mlen(ym-1,prevL)), isNow=ym===key(jp(today()));
  const cum=(l,upto)=>{const a=Array(n).fill(0);l.filter(t=>t.type==='e').forEach(t=>a[jp(t.date).d-1]+=t.amount);let s=0;return a.map((v,i)=>i<upto?(s+=v):null)};
  const pri=css('--pri'), dot=(d)=>{const last=d.reduce((m,v,i)=>v==null?m:i,-1);const ch=d.map((v,i)=>v!=null&&(i===0?v>0:v!==d[i-1]));const few=ch.filter(Boolean).length<=12;return d.map((v,i)=>v==null?0:i===last?5:few&&ch[i]?3.5:0)};
  const cur_=cum(list,isNow?jp(today()).d:mlen(ym,list)), prv_=prevL.some(t=>t.type==='e')?cum(prevL,mlen(ym-1,prevL)):null;
  mk('#c4',{type:'line',data:{labels:[...Array(n)].map((_,i)=>fa(i+1)),datasets:[
    {label:'این ماه',data:cur_,borderColor:pri,borderWidth:2.5,cubicInterpolationMode:'monotone',fill:true,order:1,
      backgroundColor:pri+'22',
      pointRadius:dot(cur_),pointHoverRadius:6,pointBackgroundColor:css('--card'),pointBorderColor:pri,pointBorderWidth:2},
    ...(prv_?[{label:'ماه قبل',data:prv_,borderColor:css('--mut'),borderWidth:1.5,borderDash:[4,4],cubicInterpolationMode:'monotone',pointRadius:0,pointHoverRadius:4,order:2}]:[])]},
    options:{interaction:{mode:'index',intersect:false},scales:{x:{...axes.x,ticks:{autoSkip:true,maxTicksLimit:8,maxRotation:0}},y:{...axes.y,ticks:{...axes.y.ticks,maxTicksLimit:5}}},
      plugins:{legend:{display:false},tooltip:{...tip,callbacks:{...tip.callbacks,title:i=>'روز '+i[0].label}}}}});
  const nd=mlen(ym,list), dd=Array(nd).fill(0);
  list.filter(t=>t.type==='e').forEach(t=>dd[jp(t.date).d-1]+=t.amount);
  mk('#c3',{type:'bar',data:{labels:dd.map((_,i)=>fa(i+1)),datasets:[{data:dd,backgroundColor:css('--pri'),borderRadius:4,borderSkipped:false}]},
    options:{scales:{...axes,x:{...axes.x,ticks:{autoSkip:true,maxTicksLimit:10}}},plugins:{legend:{display:false},tooltip:tip}}});
}

/* ---- sheet ---- */
const dlg=$('#dlg'), pick=$('#pick');
function chips(){
  $('#seg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.y===ftype));
  $('#chips').innerHTML=cats[ftype].map(([n,e])=>`<button data-c="${esc(n)}" class="${n===fcat?'on':''}">${ic(e)} ${esc(n)}</button>`).join('')+`<button data-c="+">${svg('plus')} دستهٔ جدید</button>`;
}
function openSheet(id){
  edit=id?txs.find(t=>t.id===id):null;
  ftype=edit?edit.type:'e'; fcat=edit?edit.cat:cats[ftype][0][0];
  $('#amt').value=edit?fa(edit.amount):''; $('#note').value=edit?edit.note:''; $('#date').value=edit?edit.date:today();
  $('#del').style.display=edit?'':'none'; $('#err').textContent=''; $('#amt').removeAttribute('aria-invalid'); jd(); chips(); dlg.showModal();
}
const jd=()=>$('#jdate').innerHTML=$('#date').value?svg('calendar-blank')+' '+jl($('#date').value):'';
$('#fab').onclick=()=>openSheet();
$('#date').oninput=jd;
$('#cancel').onclick=()=>dlg.close();
$('#seg').onclick=e=>{const y=e.target.closest('button')?.dataset.y;if(y){ftype=y;fcat=cats[y][0][0];chips()}};
$('#amt').oninput=e=>{const v=norm(e.target.value).replace(/\D/g,'');e.target.value=v?fa(v):'';$('#err').textContent='';e.target.removeAttribute('aria-invalid')};
$('#chips').onclick=e=>{
  const c=e.target.closest('button')?.dataset.c;if(!c)return;
  if(c==='+'){
    const n=(prompt('نام دستهٔ جدید')||'').trim();if(!n)return;
    if(cats[ftype].some(x=>x[0]===n)){fcat=n;return chips()}
    pendingName=n;$('#pname').textContent=n;
    $('#picker').innerHTML=PICK.map(k=>`<button data-k="${k}" aria-label="${k}">${svg(k)}</button>`).join('');
    return pick.showModal();
  }
  fcat=c;chips();
};
$('#picker').onclick=e=>{
  const k=e.target.closest('button')?.dataset.k;if(!k)return;
  cats[ftype].push([pendingName,k]);fcat=pendingName;save();pick.close();chips();
};
$('#pcancel').onclick=()=>pick.close();
$('#ok').onclick=()=>{
  const amount=+norm($('#amt').value), date=$('#date').value;
  if(!amount){$('#err').textContent='مبلغ را وارد کن.';$('#amt').setAttribute('aria-invalid','true');return $('#amt').focus()}
  if(!date){$('#err').textContent='تاریخ را انتخاب کن.';return}
  const t={id:edit?edit.id:Date.now(),type:ftype,amount,cat:fcat,note:$('#note').value.trim(),date};
  if(edit)txs[txs.indexOf(edit)]=t;else txs.push(t);
  save();ym=key(jp(date));dlg.close();render();toast('ذخیره شد');
};
$('#del').onclick=()=>{if(confirm('این تراکنش حذف شود؟')){txs=txs.filter(t=>t!==edit);save();dlg.close();render();toast('حذف شد')}};
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.t;render();scrollTo(0,0)}};

/* ---- backup ---- */
const dl=(parts,name,type)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(parts,{type}));a.download=name;a.click()};
const exp=()=>dl([JSON.stringify({tx:txs,cats})],`hesab-${today()}.json`,'application/json');

/* ---- report export (range) ---- */
const addD=(iso,n)=>new Date(Date.parse(iso+'T12:00:00Z')+n*864e5).toISOString().slice(0,10);
// Jalali -> ISO: start near Nowruz, step until Intl agrees; clamps day overflow (31 Mehr -> 30)
const j2i=(y,m,d)=>{for(;d>0;d--){
  let t=Date.UTC(y+621,2,21,12)+((m<=6?(m-1)*31:186+(m-7)*30)+d-1)*864e5, g=y*1e4+m*100+d;
  for(let k=0;k<4;k++){const iso=new Date(t).toISOString().slice(0,10),j=jp(iso),v=j.y*1e4+j.m*100+j.d;if(v===g)return iso;t+=v<g?864e5:-864e5}}};
const _c=jp(today());
let rng={mode:'all',f:j2i(_c.y,_c.m,1),t:today()};
function rangeOf(){
  const td=today(), c=jp(td), mon=k=>{const j=unkey(k);return[j2i(j.y,j.m,1),j2i(j.y,j.m,31)]};
  switch(rng.mode){
    case'all':return['0000-01-01','9999-12-31'];
    case'7d':return[addD(td,-6),td];
    case'lw':{const t=addD(td,-(new Date(td+'T12:00:00').getDay()+1)%7-1);return[addD(t,-6),t]}  // previous Sat..Fri
    case'tm':return mon(key(c));
    case'lm':return mon(key(c)-1);
    default:return rng.f<=rng.t?[rng.f,rng.t]:[rng.t,rng.f];
  }
}
const inRange=()=>{const[f,t]=rangeOf();return txs.filter(x=>x.date>=f&&x.date<=t).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id)};
const rlab=l=>{const[f,t]=rangeOf();return rng.mode==='all'?(l.length?`${jl(l[0].date)} تا ${jl(l.at(-1).date)}`:''):`${jl(f)} تا ${jl(t)}`};
function setR(m){rng.mode=m;render()}
function selR(){for(const k of['f','t'])rng[k]=j2i(+$('#'+k+'y').value,+$('#'+k+'m').value,+$('#'+k+'d').value);prev()}
function dsel(k){
  const j=jp(rng[k]), cy=_c.y, o=(a,s,f)=>a.map(v=>`<option value="${v}"${v==s?' selected':''}>${f(v)}</option>`).join('');
  return`<div class="sel"><select id="${k}d" onchange="selR()" aria-label="روز">${o([...Array(31)].map((_,i)=>i+1),j.d,fa)}</select>
  <select id="${k}m" onchange="selR()" aria-label="ماه">${o(MN.map((_,i)=>i+1),j.m,v=>MN[v-1])}</select>
  <select id="${k}y" onchange="selR()" aria-label="سال">${o([...Array(8)].map((_,i)=>cy-6+i),j.y,v=>fa(v,false))}</select></div>`;
}
function prev(){
  const l=inRange(), inc=sum(l.filter(t=>t.type==='i')), ex=sum(l.filter(t=>t.type==='e'));
  $('#rp').innerHTML=l.length?`<p class="muted" style="margin:12px 2px 0">${rlab(l)}</p><div class="rs"><div><small>تعداد</small><b>${fa(l.length)}</b></div><div><small>درآمد</small><b class="inc">${fa(inc)}</b></div><div><small>خرج</small><b class="exp">${fa(ex)}</b></div></div>`
    :'<p class="muted" style="margin:12px 2px 0">در این بازه تراکنشی نیست.</p>';
  document.querySelectorAll('.xp').forEach(b=>b.disabled=!l.length);
}
function exCsv(){
  const l=inRange();if(!l.length)return;
  const q=s=>{s=String(s??'');if(/^[=+\-@]/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"'}, p2=n=>String(n).padStart(2,'0');
  const rows=[['تاریخ شمسی','تاریخ میلادی','نوع','دسته','مبلغ (تومان)','توضیح'],...l.map(x=>{const j=jp(x.date);return[`${j.y}/${p2(j.m)}/${p2(j.d)}`,x.date,x.type==='i'?'درآمد':'خرج',x.cat,x.amount,x.note]})];
  dl(['﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n')],`hesab-${l[0].date}_${l.at(-1).date}.csv`,'text/csv;charset=utf-8');
  toast('فایل CSV ساخته شد');
}
function exPdf(){
  const l=inRange();if(!l.length)return;
  const inc=sum(l.filter(t=>t.type==='i')), ex=sum(l.filter(t=>t.type==='e')), rank=byCat(l.filter(t=>t.type==='e'));
  const tb=(head,rows)=>`<table><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`;
  $('#report').innerHTML=`<h1>گزارش حسابداری</h1><p>${rlab(l)}</p>
    ${tb(['درآمد','خرج','تراز','تعداد'],[[fa(inc),fa(ex),(inc-ex<0?'−':'')+fa(Math.abs(inc-ex)),fa(l.length)]])}
    ${rank.length?`<h2>خرج به تفکیک دسته</h2>${tb(['دسته','مبلغ','سهم'],rank.map(([c,v])=>[esc(c),fa(v),fa(v/ex*100)+'٪']))}`:''}
    <h2>تراکنش‌ها</h2>${tb(['تاریخ','نوع','دسته','توضیح','مبلغ (تومان)'],l.map(x=>[jl(x.date),x.type==='i'?'درآمد':'خرج',esc(x.cat),esc(x.note),fa(x.amount)]))}`;
  window.print();
}
onafterprint=()=>$('#report').innerHTML='';

$('#file').onchange=async e=>{
  try{const d=JSON.parse(await e.target.files[0].text());
    if(!Array.isArray(d.tx)||!confirm(`${fa(d.tx.length)} تراکنش جایگزین اطلاعات فعلی شود؟`))return;
    txs=d.tx;cats=d.cats||cats;save();tab='list';render();toast('بازگردانی شد')}
  catch{alert('فایل معتبر نیست')}
  e.target.value='';
};

render();
document.fonts.ready.then(()=>tab==='stats'&&render());
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
